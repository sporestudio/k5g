---
# Base packages to be installed on all nodes.
common_base_packages:
  - curl
  - wget
  - vim
  - git
  - jq
  - net-tools
  - tcpdump
  - htop
  - tree
  - unzip
  - apt-transport-https
  - ca-certificates
  - gnupg
  - software-properties-common
  - lsb-release
  - apt-utils

# Kernel modules necessaries for k8s + containerd.
# - Overlay -> filesystem overlay which k8s uses to apply image layers.
# - br_netfilter -> Allows iptables to see traffic crossing Linux bridges.
common_kernel_modules:
  - overlay
  - br_netfilter

common_upgrade_system: true

common_disble_swap: true

# Sysctl parameters for Kubernetes nodes
common_sysctl_params:
  # Enable net.bridge.bridge-nf-call-iptables to allow iptables to see bridged traffic.
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 1024
  net.ipv4.tcp_max_syn_backlog: 8192 # Max number of connections in the SYN_RECV state.
  fs.inotify.max_user_instances: 8192 # Max number of inotify instances per user,  1 instance = 1 "watch_manager" of filesystem events.
  fs.inotify.max_user_watches: 524288 # Max number of inotify watches per user, 1 watch = 1 file or directory being monitored for events.

# Firewall config
common_firewall_state: "disabled" # In lab single-node cluster is disabled, in prod will be open selectively.

# Extra hosts entries to be added to /etc/hosts
# Useful for resolving cluster nodes by name without relying on DNS, especially in lab environments.
common_extra_hosts: []
# Example:
# common_extra_hosts:
#   - { ip: "192.168.56.10", name: "k8s-master" }
#   - { ip: "192.168.56.20", name: "k8s-worker-1" }
