---
# ========================= #
# Docker repo               #
# ========================= #

# Docker repo gpg key
containerd_docker_gpg_key_url: "https://download.docker.com/linux/ubuntu/gpg"

# Path to store dearmored key
containerd_docker_gpg_keyring: "/etc/apt/keyring/docker.gpg"

# URL Docker repo
containerd_docker_apt_repo: >-
  deb [arch={{ ansible_facts['architecture'] | regex_replace('^x86_64$', 'amd64') }}
       signed-by={{ docker_gpg_keyring }}]
  https://download.docker.com/linux/ubuntu
  {{ ansible_facts['distribution_release'] }} stable

# ======================== #
# Packages                 #
# ======================== #

containerd_package_name: "containerd.io"

# ======================== #
# crictl
# ======================== #

# base URL of crictl releases.
containerd_crictl_download_url: >-
  https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-{{ crictl_arch }}.tar.gz

# Mapping Ansible architecture -> crictl architecture.
containerd_crictl_arch_map:
  x86_64: "amd64"
  aarch64: "arm64"

containerd_crictl_arch: "{{ crictl_arch_map[ansible_facts['architecture']] }}"

# Binary path
containerd_crictl_install_path: "/usr/local/bin/crictl"

# ====================== #
# Config paths
# ====================== #

containerd_config_path: "/etc/containerd/config.toml"
containerd_service_name: "containerd"
containerd_crictl_config_path: "/etc/crictl.yaml"
